<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>ZombieNet</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oswald:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <!-- ====== MAIN MENU ====== -->
    <div id="menuScreen" class="screen active">
      <div class="logo">Zombaja</div>
      <div class="logo-sub">Multiplayer Survival</div>
      <div class="menu-panel">
        <div class="field-label">Your Callsign</div>
        <input
          class="field-input"
          id="nameInput"
          type="text"
          maxlength="16"
          placeholder="Enter name..."
          autocomplete="off"
        />
        <button class="btn-primary" id="randomBtn" onclick="joinRandomGame()">
          Start Game
        </button>
        <div class="field-label">---------------------------------</div>
        <button
          class="btn-primary"
          id="createBtn"
          onclick="createPrivateLobby()"
        >
          Create private lobby
        </button>
        <div class="field-label">Join private room</div>
        <input
          class="field-input"
          id="codeInput"
          type="text"
          maxlength="16"
          placeholder="Enter code..."
          autocomplete="off"
        />
        <button class="btn-secondary" id="codeBtn" onclick="joinGame()">
          Join existing lobby
        </button>
      </div>
    </div>

    <!-- ====== LOBBY ====== -->
    <div id="lobbyScreen" class="screen">
      <div class="lobby-container">
        <div class="lobby-header">
          <div class="lobby-title">Lobby</div>
          <div class="room-badge" id="roomBadge">ROOM #--</div>
          <div class="room-code" id="roomCode"></div>
        </div>
        <div class="player-list" id="playerList"></div>
        <div class="lobby-footer">
          <div class="lobby-status">
            <span class="waiting-dots">Waiting for players</span>
          </div>
          <button class="btn-primary" id="startBtn" onclick="startGame()">
            Start Game
          </button>
          <button class="btn-secondary" onclick="leaveRoom()">
            Leave Room
          </button>
        </div>
      </div>
    </div>

    <!-- ====== GAME ====== -->
    <div id="gameScreen" class="screen">
      <div id="gameWrapper">
        <canvas id="game" width="1280" height="720" tabindex="1"></canvas>
        <div id="hud">
          <div class="hud-box">SCORE <span id="hudScore">0</span></div>
          <div class="hud-box">HP <span id="hudHp">100</span></div>
          <div class="hud-box hud-ping" id="hudPing">PING <span>--</span></div>
        </div>
        <div id="waveOverlay">
          <div class="death-title">wave 52</div>
          <div class="death-sub">oh no<span class="waiting-dots"></span></div>
        </div>
        <div id="deathOverlay">
          <div class="death-title">You Died</div>
          <div class="death-sub">
            Respawning<span class="waiting-dots"></span>
          </div>
        </div>
        <div id="controls">
          WASD - Move // RMB - Shoot // change weapon - (1-4) or scroll
        </div>
        <div id="weapon">pistol</div>
      </div>
    </div>

    <script type="module" src="./connection/gameState.js"></script>
    <script type="module" src="./connection/websocketManager.js"></script>
    <script type="module" src="./UI/screenManager.js"></script>
    <script type="module" src="./UI/menu.js"></script>
    <script type="module" src="./UI/lobby.js"></script>
    <script type="module" src="./UI/draw.js"></script>
    <script type="module" src="./logic/input.js"></script>
  </body>
</html>
